# Автодеплой на Google Cloud VM при push в main
#
# Нужны Secrets в GitHub (Settings → Secrets and variables → Actions):
#   GCP_HOST          — External IP, например 35.246.234.79
#   GCP_USER          — SSH user, например dayntypou
#   GCP_SSH_KEY       — приватный ключ целиком (-----BEGIN ... PRIVATE KEY-----)
#
# Один раз на VM: положить публичный ключ в ~/.ssh/authorized_keys
# и chmod +x ~/skuf-ai/deploy/remote-update.sh (скрипт также копируется при деплое).

name: Deploy to GCP

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "observer-service/**"
      - "quests/**"
      - "deploy/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:
    inputs:
      deploy_mod:
        description: "Build and deploy skufaddon.jar + restart MC"
        type: boolean
        default: true
      deploy_observer:
        description: "Rebuild observer Docker"
        type: boolean
        default: true
      deploy_quests:
        description: "Add ArthurTech FTB chapters (does not replace pack quests)"
        type: boolean
        default: true

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.filter.outputs.mod }}
      observer: ${{ steps.filter.outputs.observer }}
      quests: ${{ steps.filter.outputs.quests }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mod:
              - 'src/**'
              - 'build.gradle'
              - 'gradle.properties'
              - 'settings.gradle'
            observer:
              - 'observer-service/**'
              - 'deploy/docker-compose.yml'
              - 'deploy/remote-update.sh'
            quests:
              - 'quests/**'
              - 'deploy/remote-update.sh'

  build-mod:
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_mod) ||
      (github.event_name == 'push' && needs.changes.outputs.mod == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        # spotlessApply first: formatting never blocks deploy jar
        run: ./gradlew spotlessApply build -x test
      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: skufaddon-jar
          path: build/libs/skufaddon-*.jar
          if-no-files-found: error

  deploy:
    needs: [changes, build-mod]
    # always(): не блокируем observer/quests, если Java-сборка упала.
    # Jar на VM кладём только при success у build-mod (см. Decide flags).
    if: |
      always() &&
      !cancelled() &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_mod || inputs.deploy_observer || inputs.deploy_quests)) ||
        (github.event_name == 'push' && (
          needs.changes.outputs.mod == 'true' ||
          needs.changes.outputs.observer == 'true' ||
          needs.changes.outputs.quests == 'true'
        ))
      ) &&
      (
        needs.build-mod.result != 'failure' ||
        (github.event_name == 'workflow_dispatch' && (inputs.deploy_observer || inputs.deploy_quests)) ||
        (github.event_name == 'push' && (
          needs.changes.outputs.observer == 'true' ||
          needs.changes.outputs.quests == 'true'
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download jar (if built)
        if: needs.build-mod.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: skufaddon-jar
          path: /tmp/skuf-jar

      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.GCP_HOST }}
          DEPLOY_USER: ${{ secrets.GCP_USER }}
          DEPLOY_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ]; then
            echo "ERROR: Missing secret. Need GCP_HOST, GCP_USER, GCP_SSH_KEY"
            exit 1
          fi
          if echo "$DEPLOY_HOST" | grep -qiE '^(gcp_host|host|localhost)$'; then
            echo "ERROR: GCP_HOST looks wrong: '$DEPLOY_HOST'"
            echo "Set GCP_HOST secret Value to your VM External IP, e.g. 35.246.234.79"
            exit 1
          fi
          echo "Deploy target: ${DEPLOY_USER}@${DEPLOY_HOST}"

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.GCP_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Decide flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MOD_WANTED="${{ inputs.deploy_mod }}"
            OBS_WANTED="${{ inputs.deploy_observer }}"
            QUEST_WANTED="${{ inputs.deploy_quests }}"
          else
            MOD_WANTED="${{ needs.changes.outputs.mod }}"
            OBS_WANTED="${{ needs.changes.outputs.observer }}"
            QUEST_WANTED="${{ needs.changes.outputs.quests }}"
          fi

          # Jar только если Gradle реально собрал артефакт
          if [ "$MOD_WANTED" = "true" ] && [ "${{ needs.build-mod.result }}" = "success" ]; then
            echo "mod=true" >> "$GITHUB_OUTPUT"
          else
            echo "mod=false" >> "$GITHUB_OUTPUT"
          fi
          echo "observer=$OBS_WANTED" >> "$GITHUB_OUTPUT"
          echo "quests=$QUEST_WANTED" >> "$GITHUB_OUTPUT"

          if [ "$MOD_WANTED" = "true" ] && [ "${{ needs.build-mod.result }}" = "failure" ]; then
            echo "mod_build_failed=true" >> "$GITHUB_OUTPUT"
            echo "WARN: build-mod failed — will still deploy observer/quests if requested, skip jar"
          else
            echo "mod_build_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload jar + update script
        env:
          DEPLOY_HOST: ${{ secrets.GCP_HOST }}
          DEPLOY_USER: ${{ secrets.GCP_USER }}
        run: |
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          $SCP deploy/remote-update.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/remote-update.sh"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/skuf-ai/deploy && mv /tmp/remote-update.sh ~/skuf-ai/deploy/remote-update.sh && chmod +x ~/skuf-ai/deploy/remote-update.sh"
          if [ "${{ steps.flags.outputs.mod }}" = "true" ]; then
            JAR=$(ls /tmp/skuf-jar/skufaddon-*.jar | head -n1)
            $SCP "$JAR" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/skufaddon-upload.jar"
          fi

      - name: Sync ArthurTech quest chapters (additive)
        if: steps.flags.outputs.quests == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.GCP_HOST }}
          DEPLOY_USER: ${{ secrets.GCP_USER }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /tmp/skuf-quests-chapters && rm -f /tmp/skuf-quests-chapters/*.snbt"
          # Только chapters/*.snbt — не data.snbt / chapter_groups (книга пака сохраняется)
          rsync -az -e "ssh $SSH_OPTS" \
            quests/config/ftbquests/quests/chapters/*.snbt \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/skuf-quests-chapters/"

      - name: Sync observer sources (keep server .env)
        if: steps.flags.outputs.observer == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.GCP_HOST }}
          DEPLOY_USER: ${{ secrets.GCP_USER }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rsync
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude '.venv' --exclude '.env' --exclude '__pycache__' \
            observer-service/ "$DEPLOY_USER@$DEPLOY_HOST:~/skuf-ai/observer-service/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            deploy/docker-compose.yml deploy/remote-update.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:~/skuf-ai/deploy/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x ~/skuf-ai/deploy/remote-update.sh"

      - name: Run remote update
        env:
          DEPLOY_HOST: ${{ secrets.GCP_HOST }}
          DEPLOY_USER: ${{ secrets.GCP_USER }}
        run: |
          MOD_FLAG=0
          OBS_FLAG=0
          QUEST_FLAG=0
          [ "${{ steps.flags.outputs.mod }}" = "true" ] && MOD_FLAG=1
          [ "${{ steps.flags.outputs.observer }}" = "true" ] && OBS_FLAG=1
          [ "${{ steps.flags.outputs.quests }}" = "true" ] && QUEST_FLAG=1
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "UPDATE_MOD=$MOD_FLAG UPDATE_OBSERVER=$OBS_FLAG UPDATE_QUESTS=$QUEST_FLAG RESTART_MC=1 bash ~/skuf-ai/deploy/remote-update.sh"

      # После observer/quests: workflow красный, если jar не собрался (сигнал в Actions)
      - name: Fail if mod build failed
        if: steps.flags.outputs.mod_build_failed == 'true'
        run: |
          echo "build-mod failed — jar not deployed; observer/quests (if any) already updated above."
          exit 1
