# .no-mistakes.yaml

agent: auto

commands:
  lint: "python scripts/nm_gradle.py spotlessCheck --no-daemon"
  format: "python scripts/nm_gradle.py spotlessApply --no-daemon"

ignore_patterns:
  - ".gradle/**"
  - "build/**"
  - "bin/**"
  - "libraries/**"
  - "scripts/**"
  - ".claude/**"
  - ".codegraph/**"
  - ".cursor/**"
  - ".eclipse/**"
  - ".serena/**"
  - "src/generated/**"

document:
  instructions: |
    - CLAUDE.md: Owns the build commands and developer instructions for AI agents.
    - PROJECT_LOGIC.md: Owns the detailed technical design, package structure, and mechanics (Aura, Tilt, Line Mode, etc.).
    - README.md: Owns the high-level introduction and player guide.
    - Keep documentation concise, accurate, and aligned. Avoid duplicating the same logic descriptions across multiple files.

auto_fix:
  review: 1
  lint: 3
  document: 3
  test: 0

commit:
  fix_message: "chore(no-mistakes-{{.Step}}): {{.Summary}}"

