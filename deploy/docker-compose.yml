services:
  observer-api:
    build: ../observer-service
    container_name: skuf-observer
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../observer-service/.env
    # host.docker.internal → хост VM (RCON 25575, inbound мода 8081)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
